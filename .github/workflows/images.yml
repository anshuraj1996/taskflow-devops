name: Docker Images

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: backend/Dockerfile
            image: ghcr.io/anshuraj1996/taskflow-api

          - name: web
            dockerfile: frontend/Dockerfile
            image: ghcr.io/anshuraj1996/taskflow-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Smoke test API
        if: matrix.name == 'api'
        shell: bash
        env:
          IMAGE_TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          DATABASE_URL: postgresql://test_user:test_password@postgres:5432/app_test
          NETWORK: ${{ job.services.postgres.network }}
        run: |
          set -Eeuo pipefail

          CONTAINER_NAME="api-smoke"

          cleanup() {
            docker logs "$CONTAINER_NAME" 2>&1 || true
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          }

          docker run -d \
            --name "$CONTAINER_NAME" \
            --network "$NETWORK" \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            "$IMAGE_TAG"

          for attempt in $(seq 1 60); do
            if docker exec "$CONTAINER_NAME" \
              wget -qO- http://127.0.0.1:4000/health/ready \
              >/dev/null 2>&1; then
              echo "API readiness check passed."
              docker rm -f "$CONTAINER_NAME" >/dev/null
              exit 0
            fi

            if ! docker inspect \
              --format='{{.State.Running}}' "$CONTAINER_NAME" \
              2>/dev/null | grep -q true; then
              echo "API container stopped unexpectedly."
              cleanup
              exit 1
            fi

            sleep 1
          done

          echo "API did not become ready within 60 seconds."
          cleanup
          exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Record published image digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published Docker image"
            echo ""
            echo "- Image: \`$IMAGE\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Immutable reference: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
