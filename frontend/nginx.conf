server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The React app calls relative URLs; forward API traffic to the backend
    # container (service name "api"), just like the Vite proxy does in development.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    location /health/ {
        proxy_pass http://api:4000;
    }

    # Vite puts content-hashed files under /assets: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA routing: unknown paths fall back to index.html, which must never be cached
    # so users pick up new deployments immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
