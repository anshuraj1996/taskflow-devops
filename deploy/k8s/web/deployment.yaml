apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: taskflow
  labels:
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: web

spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: web

  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: taskflow
        app.kubernetes.io/managed-by: kubectl

    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsUser: 101
        runAsGroup: 101

        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: web
          image: ghcr.io/anshuraj1996/taskflow-web:main
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
