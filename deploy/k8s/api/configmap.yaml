apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: taskflow
  labels:
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: api

data:
  NODE_ENV: production
  PORT: '4000'
  LOG_LEVEL: info
  CORS_ORIGIN: 'http://taskflow.local'
  JWT_EXPIRES_IN: 1d
