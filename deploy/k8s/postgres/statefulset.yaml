apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: taskflow
  labels:
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: postgres

spec:
  serviceName: postgres
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: postgres

  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: taskflow
        app.kubernetes.io/managed-by: kubectl
        app.kubernetes.io/name: postgres

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - taskflow
                - -d
                - taskflow
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - taskflow
                - -d
                - taskflow
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6

          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: taskflow
          app.kubernetes.io/managed-by: kubectl
          app.kubernetes.io/name: postgres
      spec:
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
