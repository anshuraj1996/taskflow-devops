apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: api


type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql://taskflow:%s@postgres:5432/taskflow" (required "secrets.postgresPassword is required" .Values.secrets.postgresPassword) | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
