apiVersion: apps/v1
kind: Deployment
metadata:
  name: api

  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: api

spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}


  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: api

  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/api-secret.yaml") . | sha256sum }}
      labels:
        {{- include "taskflow.labels" . | nindent 8 }}
        app.kubernetes.io/name: api

    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: api
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000

        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          image: {{ include "taskflow.image" .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          lifecycle:
            preStop:
              sleep:
                seconds: 5


          ports:
            - name: http
              containerPort: 4000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
