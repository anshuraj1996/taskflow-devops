# Full stack: PostgreSQL -> migrate (one-off) -> api -> web (nginx on :8080).
#   docker compose up -d --build
# `npm run db:up` still starts only PostgreSQL for local development.
services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    restart: unless-stopped
    # Give PostgreSQL time to flush to disk on stop; a forced kill means crash recovery on start.
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - taskflow-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@postgres:5432/${POSTGRES_DB:-taskflow}?schema=public'
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: taskflow-api:dev
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@postgres:5432/${POSTGRES_DB:-taskflow}?schema=public'
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
    ports:
      - '${API_PORT:-4000}:4000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health/live']
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: taskflow-web:dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:8080'

volumes:
  taskflow-pgdata:
